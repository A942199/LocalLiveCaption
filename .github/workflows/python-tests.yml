name: Python regression (Windows)

on:
  pull_request:
    paths:
      - 'live-caption-ja.pyw'
      - 'translation/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'live-caption-ja.pyw'
      - 'translation/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-regression:
    name: Python tests (Windows 3.11)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: |
          python -B -m compileall -q translation tests
          python -B -m py_compile live-caption-ja.pyw
      - name: Run Python regression tests (no model downloads)
        env:
          _LIVE_CAPTION_PYW_BOOTSTRAPPED: '1'
        run: python -B -m unittest discover -s tests -p "test_*.py" -q
