name: Python 字幕程序错误
description: 报告 LocalLiveCaption Python 日语识别或中文字幕的问题
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题与复现步骤
      placeholder: 描述具体操作、预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: 运行环境
      description: Windows 版本、显卡、Qwen3-ASR 模型、Python 版本、翻译引擎
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先删除 API 密钥、令牌和个人信息
